name: ci

# Pull requests only. A push trigger would double every job for any branch that has
# an open PR, since both events match the same commit.
on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The PR title is what becomes the commit on a squash merge, so it is the thing that matters.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./tools/check-commit-msg.sh "$PR_TITLE"
      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./tools/check-commit-msg.sh --range "$BASE_SHA..HEAD"

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./tools/check-version.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not recursive: OpenMemories-Platform pins an stlport submodule whose SourceForge
          # repo is gone, and it is only used by the updater build. APP_STL := stlport_static
          # resolves to the NDK's own bundled STLport.
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the SDK packages
        run: |
          # sdkmanager is not on PATH on the runner image.
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -x "$SDKMANAGER" ] || { echo "no sdkmanager under $ANDROID_SDK_ROOT" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"
      - name: Build
        env:
          # Signed with the project key so the artifact can be installed over an existing app.
          # Absent on fork PRs, where build.sh falls back to a throwaway key.
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          ./build.sh
      # Catches a leaked errno.h rename or a manifest the build mutated.
      - name: Working tree must be clean
        run: git diff --exit-code
      - name: Name the artifact
        id: name
        run: |
          . tools/version.sh
          mv RecipeLab.apk "RecipeLab-$VERSION_NAME+${GITHUB_SHA::7}.apk"
          echo "file=RecipeLab-$VERSION_NAME+${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 14
