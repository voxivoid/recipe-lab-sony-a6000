name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The project signing key lives in this environment, so ci.yml and dev-build.yml
    # cannot reach it even if one of them is edited.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not recursive: OpenMemories-Platform pins an stlport submodule whose SourceForge
          # repo is gone, and it is only used by the updater build. APP_STL := stlport_static
          # resolves to the NDK's own bundled STLport.
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the SDK packages
        run: |
          # sdkmanager is not on PATH on the runner image.
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          [ -x "$SDKMANAGER" ] || { echo "no sdkmanager under $ANDROID_SDK_ROOT" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28" "ndk;16.1.4479499"

      # RELEASE=1 makes tools/version.sh fail outright if the tag does not match the
      # manifest, so a tag can never ship a version it does not contain.
      - name: Build the release
        env:
          RELEASE: '1'
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          ./build.sh
      - name: Working tree must be clean
        run: git diff --exit-code

      - name: Write the release notes
        run: |
          RELEASE=1 . tools/version.sh
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            printf '## Recipe Lab %s\n\n' "$VERSION_NAME"
            for pair in "feat:New" "fix:Fixed" "perf:Performance"; do
              t="${pair%%:*}"; h="${pair##*:}"
              body="$(git log "$RANGE" --no-merges --pretty='%s' | grep -E "^$t(\(|!|:)" | sed -E 's/^[a-z]+(\([^)]*\))?!?: /* /' || true)"
              [ -n "$body" ] && printf '### %s\n\n%s\n\n' "$h" "$body"
            done
            other="$(git log "$RANGE" --no-merges --pretty='%s' | grep -vE '^(feat|fix|perf|chore)(\(|!|:)' | sed -E 's/^[a-z]+(\([^)]*\))?!?: /* /' || true)"
            [ -n "$other" ] && printf '### Other\n\n%s\n\n' "$other"
            printf '### Installing\n\nDownload `RecipeLab-%s.apk` and install it with [Sony-PMCA-RE](https://github.com/ma1co/Sony-PMCA-RE) — see the [README](https://github.com/%s#installing).\n' "$VERSION_NAME" "$GITHUB_REPOSITORY"
          } > notes.md
          mv RecipeLab.apk "RecipeLab-$VERSION_NAME.apk"
          sha256sum "RecipeLab-$VERSION_NAME.apk" > "RecipeLab-$VERSION_NAME.apk.sha256"
          # A stable filename so README's releases/latest/download link never breaks.
          cp "RecipeLab-$VERSION_NAME.apk" RecipeLab.apk
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Recipe Lab $VERSION_NAME" \
            --notes-file notes.md \
            --latest \
            "RecipeLab-$VERSION_NAME.apk" "RecipeLab-$VERSION_NAME.apk.sha256" RecipeLab.apk

      - name: Close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open" \
                --jq ".[] | select(.title == \"$GITHUB_REF_NAME\") | .number")"
          if [ -n "$n" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$n" -f state=closed
            echo "closed milestone $GITHUB_REF_NAME"
          else
            echo "no open milestone named $GITHUB_REF_NAME — nothing to close"
          fi
